<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>局部放大</title>
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #wrap{position:absolute;transform-origin:0 0}
  img{display:block}
</style></head>
<body>
<div id="wrap"><img id="im" alt=""></div>
<script>
const q = new URLSearchParams(location.search);
const src = q.get('src') || '/.shots/app-390b.png';
const zoom = Number(q.get('z') || 3);
const x = Number(q.get('x') || 0);
const y = Number(q.get('y') || 0);
const im = document.getElementById('im');
const wrap = document.getElementById('wrap');
im.onload = () => {
  wrap.style.transform = `scale(${zoom}) translate(${-x}px, ${-y}px)`;
  document.title = 'ZOOM-OK ' + im.naturalWidth + 'x' + im.naturalHeight;
};
im.onerror = () => { document.title = 'ZOOM-ERR'; };
im.src = src;
</script>
</body>
</html>
